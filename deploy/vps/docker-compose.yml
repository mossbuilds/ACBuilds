# ACBuilds on the VPS: ONE MariaDB, two game servers.
#   shared:   ace_auth (accounts, so one login works on both) and ace_world (game content)
#   separate: ace_shard (stock characters/items) and ace_shard_vr (VR server characters/items)
# The shard MUST be separate: each server hands out object IDs from its own counter, so two servers on one shard database collide
# ('Duplicate entry ... for key PRIMARY' when creating a character).
#   ace-server     stock ACE       UDP 9000/9001   (normal game)
#   ace-vr-server  VR-enabled ACE  UDP 9100/9101   (Thwargle/ACE fork, for AC:VR)
# BIND_IP (in /opt/acbuilds/.env) is 127.0.0.1 until the owner account exists, then 0.0.0.0 to open the game to the internet.
name: acbuilds
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"
services:
  ace-db:
    image: ghcr.io/mossbuilds/acbuilds-db:${ACB_TAG:-latest}
    container_name: ace-db
    restart: unless-stopped
    logging: *default-logging
    environment:
      INNODB_BUFFER_POOL_SIZE: ${INNODB_BUFFER_POOL_SIZE:-1G}
    volumes:
      - ace-db:/var/lib/mysql
    # 3306 is NOT published: only the game servers can reach the database.
  ace-server:
    image: ghcr.io/mossbuilds/acbuilds-server:${ACB_TAG:-latest}
    container_name: ace-server
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      ace-db: { condition: service_healthy }
    ports:
      - "${BIND_IP:-0.0.0.0}:9000:9000/udp"
      - "${BIND_IP:-0.0.0.0}:9001:9001/udp"
    volumes:
      - ${DATS_DIR:-/opt/acbuilds/dats}:/ace/Dats:ro
      - /opt/acbuilds/mods:/ace/Mods
      - /opt/acbuilds/content:/ace/Content
  ace-vr-server:
    image: ghcr.io/mossbuilds/acbuilds-vr-server:${ACB_TAG:-latest}
    container_name: ace-vr-server
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      ace-db: { condition: service_healthy }
    ports:
      - "${BIND_IP:-0.0.0.0}:9100:9000/udp"
      - "${BIND_IP:-0.0.0.0}:9101:9001/udp"
    volumes:
      - ${DATS_DIR:-/opt/acbuilds/dats}:/ace/Dats:ro
      - /opt/acbuilds/mods-vr:/ace/Mods
      # config-vr.js = config/Config.js with the SHARD database renamed to ace_shard_vr (generated by deploy.sh). ACE copies
      # /ace/Config/Config.js over /ace/Config.js at every start, so only this path is mounted (and it must not be read-only at /ace/Config.js).
      - /opt/acbuilds/config-vr.js:/ace/Config/Config.js:ro
      - /opt/acbuilds/content:/ace/Content
volumes:
  ace-db:
