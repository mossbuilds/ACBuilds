<g fill="#222">
<text x="70" y="70">push, every 30 min, manual</text>
<text x="70" y="132">check: latest ACE commit,</text><text x="70" y="150">world release, watched repos</text>
<text x="70" y="212">fingerprint changed?</text><text x="70" y="230">no: stop / yes: build</text>
<text x="70" y="295">version vACE-acb.N</text><text x="70" y="313">e.g. v1.78.4816-acb.2</text>
<text x="345" y="142" font-weight="bold">acbuilds-server image</text>
<text x="345" y="168">1 ACEmulator/ACE @ pinned SHA</text><text x="360" y="186" fill="#555">dotnet publish to /ace</text>
<text x="345" y="212">2 mods built against /ace (net10)</text><text x="360" y="230" fill="#555">OptimShi/CustomClothingBase</text><text x="360" y="248" fill="#555">ACE.Mods.WebAPI / ACE.Web</text><text x="360" y="266" fill="#555">failed mod = skipped, logged</text>
<text x="345" y="292">3 .NET 10 runtime + Config.js</text><text x="360" y="310" fill="#555">start: wait DB, copy mods, run</text>
<text x="345" y="392" font-weight="bold">acbuilds-db image (seeded at build)</text>
<text x="345" y="418">1 world data (ACE-World release)</text><text x="345" y="438">2 ACEUniqueWeenies over world</text>
<text x="345" y="458">3 Auth base + updates (old to new)</text><text x="345" y="478">4 Shard base + updates (old to new)</text><text x="345" y="502" fill="#555">into /opt/mysql-seed, MariaDB 2G buffer</text>
<text x="700" y="298" font-weight="bold">GitHub release + tag</text><text x="700" y="318">links both images</text>
<text x="700" y="422" font-weight="bold">Your machine (compose)</text><text x="700" y="442">ace-db (healthy), then ace-server</text><text x="700" y="462">UDP 9000/9001, DB private</text><text x="700" y="482" fill="#555">acb.sh: backup/restore/update</text>
</g></svg>
