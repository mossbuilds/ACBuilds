name: build-and-publish

# One workflow, auto-magic: polls upstream every 30 min and rebuilds only when something changed.
# (GitHub cannot webhook from repos we don't own, so polling is the trigger for ACEmulator/ACE.)
on:
  push:
    branches: [main]
    # content, docs and Markdown changes do not change any image or the VPS, so they do not rebuild or redeploy
    paths-ignore: ["custom-content/**", "docs/**", "**/*.md", "deploy/LAST_GOOD.txt", "deploy/BLACKLIST.txt"]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if upstream is unchanged"
        type: boolean
        default: false
      warn_minutes:
        description: "in-game warning before the servers restart; 0 = deploy immediately"
        type: string
        default: "10"

permissions:
  contents: write
  packages: write

concurrency:
  group: build
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/acbuilds
  # Upstream repos watched. ACE core + world data drive the image; the others are recorded in the
  # image label so a change in any of them triggers a rebuild too.
  ACE_REPO: ACEmulator/ACE
  # VR-enabled ACE fork; built as a SECOND, separate server (never replaces the stock one)
  VR_ACE_REPO: Thwargle/ACE
  WORLD_REPO: ACEmulator/ACE-World-16PY-Patches
  WATCHED: >-
    aquafir/ACE.BaseMod shemtar-90/AceForge OptimShi/CustomClothingBase
    titaniumweiner/ACEUniqueWeenies bDekaru/Melt titaniumweiner/OpenDereth

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.cmp.outputs.build }}
      build_stock: ${{ steps.cmp.outputs.build_stock }}
      build_vr: ${{ steps.cmp.outputs.build_vr }}
      ace_sha: ${{ steps.up.outputs.ace_sha }}
      vr_sha: ${{ steps.up.outputs.vr_sha }}
      version: ${{ steps.up.outputs.version }}
      world_tag: ${{ steps.up.outputs.world_tag }}
      fingerprint: ${{ steps.up.outputs.fingerprint }}
      vr_fingerprint: ${{ steps.up.outputs.vr_fingerprint }}
      watched: ${{ steps.up.outputs.watched }}
      old_ace_sha: ${{ steps.cmp.outputs.old_ace_sha }}
      old_vr_sha: ${{ steps.cmp.outputs.old_vr_sha }}
      old_world_tag: ${{ steps.cmp.outputs.old_world_tag }}
      old_watched: ${{ steps.cmp.outputs.old_watched }}
    steps:
      - name: Resolve upstream state
        id: up
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ace=$(gh api repos/$ACE_REPO/commits/master --jq .sha)
          world=$(gh api repos/$WORLD_REPO/releases/latest --jq .tag_name)
          extra=""
          for r in $WATCHED; do
            s=$(gh api repos/$r/commits --jq '.[0].sha' 2>/dev/null || echo none)
            extra="$extra $r@$s"
          done
          # Version = latest ACE release tag + our own revision: v1.78.4816-acb.3
          acev=$(gh api repos/$ACE_REPO/releases/latest --jq .tag_name)
          n=$(gh api "repos/${{ github.repository }}/git/matching-refs/tags/${acev}-acb." --jq 'length' 2>/dev/null || echo 0)
          echo "version=${acev}-acb.$((n+1))" >> "$GITHUB_OUTPUT"
          vr=$(gh api repos/$VR_ACE_REPO/commits/master --jq .sha)
          echo "vr_sha=$vr" >> "$GITHUB_OUTPUT"
          echo "ace_sha=$ace" >> "$GITHUB_OUTPUT"
          echo "world_tag=$world" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$(echo "$ace $world $extra" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "vr_fingerprint=$(echo "$vr $world $extra" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "watched=$(echo "$extra" | xargs)" >> "$GITHUB_OUTPUT"
      - name: Compare with published images
        id: cmp
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          label() { docker buildx imagetools inspect "$1" --format '{{json .Image.Config.Labels}}' 2>/dev/null | jq -r --arg k "$2" '.[$k] // ""' || true; }
          old=$(label "$IMAGE-server:latest" acbuilds.fingerprint)
          oldvr=$(label "$IMAGE-vr-server:latest" acbuilds.vr.fingerprint)
          new="${{ steps.up.outputs.fingerprint }}"
          newvr="${{ steps.up.outputs.vr_fingerprint }}"
          echo "stock: published=$old upstream=$new | vr: published=$oldvr upstream=$newvr"
          # Previous per-component values (so a later run can print a human diff, not just "the fingerprint changed").
          # These are only as good as what got stored on the currently-published :latest image, so a fresh repo/registry
          # prints them empty the first time - the changelog step below treats an empty "old" value as "unknown baseline".
          echo "old_ace_sha=$(label "$IMAGE-server:latest" acbuilds.ace_sha)" >> "$GITHUB_OUTPUT"
          echo "old_vr_sha=$(label "$IMAGE-vr-server:latest" acbuilds.vr.ace)" >> "$GITHUB_OUTPUT"
          echo "old_world_tag=$(label "$IMAGE-server:latest" acbuilds.world_tag)" >> "$GITHUB_OUTPUT"
          echo "old_watched=$(label "$IMAGE-server:latest" acbuilds.watched)" >> "$GITHUB_OUTPUT"
          force=false
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.force }}" = "true" ]; then force=true; fi
          bs=false; bv=false
          if [ "$force" = true ] || [ "$old" != "$new" ]; then bs=true; fi
          if [ "$force" = true ] || [ "$oldvr" != "$newvr" ]; then bv=true; fi
          # Thwargle/ACE also carries its Unreal client project under Unreal/. Commits that touch only that folder change
          # nothing in the server we build, so they neither rebuild nor redeploy the VR server (Tom, 2026-09-23). Applied
          # only when nothing else moved (stock fingerprint unchanged = same ACE, world data and watched mods) and the fork
          # simply moved forward; anything unusual (no baseline, diverged history, a capped file list, a file moved into or
          # out of Unreal/) falls back to rebuilding.
          if [ "$bv" = true ] && [ "$force" != true ] && [ "$bs" = false ]; then
            prev_vr=$(label "$IMAGE-vr-server:latest" acbuilds.vr.ace)
            cur_vr="${{ steps.up.outputs.vr_sha }}"
            if [ -n "$prev_vr" ] && [ "$prev_vr" != "$cur_vr" ]; then
              cmpjson=$(gh api "repos/$VR_ACE_REPO/compare/$prev_vr...$cur_vr" 2>/dev/null || echo '{}')
              st=$(echo "$cmpjson" | jq -r '.status // ""')
              nf=$(echo "$cmpjson" | jq -r '(.files // []) | length')
              other=$(echo "$cmpjson" | jq -r '[(.files // [])[] | select(((.filename | startswith("Unreal/")) and ((.previous_filename // .filename) | startswith("Unreal/"))) | not)] | length')
              if [ "$st" = "ahead" ] && [ "$nf" -gt 0 ] && [ "$nf" -lt 300 ] && [ "$other" = "0" ]; then
                echo "vr: fork moved ${prev_vr:0:12} -> ${cur_vr:0:12}, but only Unreal/ changed ($nf files) - VR rebuild skipped"
                bv=false
              else
                echo "vr: fork moved ${prev_vr:0:12} -> ${cur_vr:0:12} (status=$st files=$nf outside-Unreal=$other) - rebuilding"
              fi
            fi
          fi
          echo "build_stock=$bs" >> "$GITHUB_OUTPUT"
          echo "build_vr=$bv" >> "$GITHUB_OUTPUT"
          if [ "$bs" = true ] || [ "$bv" = true ]; then echo "build=true" >> "$GITHUB_OUTPUT"; else echo "build=false" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history: the changelog step below diffs commits since the previous push
      - name: Changelog - what triggered this build
        id: changelog
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          DEPLOY_ON: ${{ secrets.VPS_DEPLOY || vars.VPS_DEPLOY }}
        run: |
          {
            echo "## What changed this cycle"
            if [ "$EVENT" = "push" ]; then
              echo "Triggered by a **push to main** (local commit(s) - code, mods, or custom content)."
              if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
                echo
                echo "Commits since the previous push:"
                echo '```'
                git log "$BEFORE..${{ github.sha }}" --oneline
                echo '```'
              else
                echo "(previous commit not available to diff against - first push seen by this workflow, or history was rewritten)"
              fi
            elif [ "$EVENT" = "workflow_dispatch" ]; then
              echo "Triggered **manually** (workflow_dispatch, force=${{ inputs.force }})."
            else
              echo "Triggered by the **scheduled upstream poll** (cron) - no new commits to this repo; something upstream moved:"
            fi
            if [ "$EVENT" != "push" ]; then
              echo
              old_ace="${{ needs.check.outputs.old_ace_sha }}"; new_ace="${{ needs.check.outputs.ace_sha }}"
              old_vr="${{ needs.check.outputs.old_vr_sha }}"; new_vr="${{ needs.check.outputs.vr_sha }}"
              old_world="${{ needs.check.outputs.old_world_tag }}"; new_world="${{ needs.check.outputs.world_tag }}"
              old_watched="${{ needs.check.outputs.old_watched }}"; new_watched="${{ needs.check.outputs.watched }}"
              any=false
              if [ -z "$old_ace" ]; then echo "- (no previous ACE sha recorded on the published image yet - baseline unknown)"; any=true
              elif [ "$old_ace" != "$new_ace" ]; then echo "- upstream ACE master advanced from \`$old_ace\` to \`$new_ace\`"; any=true; fi
              if [ -z "$old_vr" ]; then echo "- (no previous VR-fork sha recorded on the published image yet - baseline unknown)"; any=true
              elif [ "$old_vr" != "$new_vr" ]; then echo "- VR fork (Thwargle/ACE) advanced from \`$old_vr\` to \`$new_vr\`"; any=true; fi
              if [ -n "$old_world" ] && [ "$old_world" != "$new_world" ]; then echo "- world-data release bumped from \`$old_world\` to \`$new_world\`"; any=true; fi
              if [ -n "$old_watched" ] && [ "$old_watched" != "$new_watched" ]; then
                echo "- a watched mod repo changed:"; echo "  - was: \`$old_watched\`"; echo "  - now: \`$new_watched\`"; any=true
              fi
              [ "$any" = true ] || echo "- no upstream fingerprint input changed (this run was forced)"
            fi
            echo
            if [ "$DEPLOY_ON" = "true" ]; then
              echo "**Deploying to production** after this build (VPS_DEPLOY is on)."
            else
              echo "Build only - \`VPS_DEPLOY\` is off, no deploy triggered."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
        # DEPLOY_ON mirrors the same secret-or-variable read the deploy job uses (secrets can't be read directly in most
        # contexts here either, so it is copied into env the same way).
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push server image
        if: needs.check.outputs.build_stock == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server
          push: true
          build-args: |
            ACE_REF=${{ needs.check.outputs.ace_sha }}
            MODS_REV=${{ needs.check.outputs.fingerprint }}
          labels: |
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
            acbuilds.fingerprint=${{ needs.check.outputs.fingerprint }}
            acbuilds.ace_sha=${{ needs.check.outputs.ace_sha }}
            acbuilds.world_tag=${{ needs.check.outputs.world_tag }}
            acbuilds.watched=${{ needs.check.outputs.watched }}
          tags: |
            ${{ env.IMAGE }}-server:latest
            ${{ env.IMAGE }}-server:${{ needs.check.outputs.version }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
      - name: Build and push database image
        if: needs.check.outputs.build_stock == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.db
          push: true
          build-args: |
            ACE_REF=${{ needs.check.outputs.ace_sha }}
            MODS_REV=${{ needs.check.outputs.fingerprint }}
            WORLD_TAG=${{ needs.check.outputs.world_tag }}
          labels: |
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
          tags: |
            ${{ env.IMAGE }}-db:latest
            ${{ env.IMAGE }}-db:${{ needs.check.outputs.version }}
          cache-from: type=gha,scope=db
          cache-to: type=gha,mode=max,scope=db
      - name: Build and push VR server image
        if: needs.check.outputs.build_vr == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server
          push: true
          build-args: |
            ACE_REPO=https://github.com/${{ env.VR_ACE_REPO }}.git
            ACE_REF=${{ needs.check.outputs.vr_sha }}
            MODS_REV=${{ needs.check.outputs.fingerprint }}
          labels: |
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
            acbuilds.vr.ace=${{ needs.check.outputs.vr_sha }}
            acbuilds.vr.fingerprint=${{ needs.check.outputs.vr_fingerprint }}
            acbuilds.world_tag=${{ needs.check.outputs.world_tag }}
            acbuilds.watched=${{ needs.check.outputs.watched }}
          tags: |
            ${{ env.IMAGE }}-vr-server:latest
            ${{ env.IMAGE }}-vr-server:${{ needs.check.outputs.version }}
          cache-from: type=gha,scope=vr-server
          cache-to: type=gha,mode=max,scope=vr-server
      - name: Build and push VR database image
        if: needs.check.outputs.build_vr == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.db
          push: true
          build-args: |
            ACE_REPO=https://github.com/${{ env.VR_ACE_REPO }}.git
            ACE_REF=${{ needs.check.outputs.vr_sha }}
            WORLD_TAG=${{ needs.check.outputs.world_tag }}
            MODS_REV=${{ needs.check.outputs.fingerprint }}
          labels: |
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
          tags: |
            ${{ env.IMAGE }}-vr-db:latest
            ${{ env.IMAGE }}-vr-db:${{ needs.check.outputs.version }}
          cache-from: type=gha,scope=vr-db
          cache-to: type=gha,mode=max,scope=vr-db
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILT_STOCK: ${{ needs.check.outputs.build_stock }}
          BUILT_VR: ${{ needs.check.outputs.build_vr }}
        run: |
          v="${{ needs.check.outputs.version }}"
          notes=""
          if [ "$BUILT_STOCK" = true ]; then
            notes="$notes
          Server: \`docker pull ${{ env.IMAGE }}-server:$v\`
          Database: \`docker pull ${{ env.IMAGE }}-db:$v\`
          - ACE: https://github.com/ACEmulator/ACE/commit/${{ needs.check.outputs.ace_sha }}"
          fi
          if [ "$BUILT_VR" = true ]; then
            notes="$notes
          VR server (separate, from Thwargle/ACE): \`docker pull ${{ env.IMAGE }}-vr-server:$v\` and \`docker pull ${{ env.IMAGE }}-vr-db:$v\`
          - VR ACE fork: https://github.com/Thwargle/ACE/commit/${{ needs.check.outputs.vr_sha }}"
          fi
          notes="$notes
          Packages: https://github.com/${{ github.repository }}/pkgs/container/acbuilds-server , https://github.com/${{ github.repository }}/pkgs/container/acbuilds-vr-server
          - World data: ${{ needs.check.outputs.world_tag }}"
          gh release create "$v" --target "$(git rev-parse HEAD)" --title "ACBuilds $v" --notes "$notes"

  # Self-contained launcher executables (Python + PyInstaller), one per OS, attached to the same versioned release.
  launcher:
    needs: [check, build]
    if: needs.check.outputs.build == 'true'
    strategy:
      matrix:
        include:
          - { os: windows-latest, asset: acbuilds-windows-x64.exe, dist: acbuilds.exe }
          - { os: ubuntu-latest,  asset: acbuilds-linux-x64,       dist: acbuilds }
          - { os: macos-latest,   asset: acbuilds-macos-arm64,     dist: acbuilds }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build executable
        shell: bash
        run: |
          pip install pyinstaller
          echo 'VERSION = "${{ needs.check.outputs.version }}"' > launcher/_version.py
          cd launcher && pyinstaller --onefile --name acbuilds --paths . --hidden-import gui acblauncher.py
          cp dist/${{ matrix.dist }} ../${{ matrix.asset }}
      - name: Attach to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.check.outputs.version }}" "${{ matrix.asset }}" --clobber

  # Auto-deploy to the VPS after a successful publish. Off until VPS_DEPLOY (secret or variable) is 'true'.
  # The deploy key can only run /opt/acbuilds/deploy.sh (SSH forced command); that script backs up the database FIRST.
  deploy:
    needs: [check, build]
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: vps-deploy
      cancel-in-progress: false
    # VPS_DEPLOY can be a repository secret OR a repository variable (secrets cannot be read in a job-level 'if', so it is
    # copied into the environment here and checked per step).
    env:
      DEPLOY_ON: ${{ secrets.VPS_DEPLOY || vars.VPS_DEPLOY }}
    steps:
      - name: Skipped (VPS_DEPLOY is not 'true')
        if: env.DEPLOY_ON != 'true'
        run: |
          echo "VPS auto-deploy is off. Set VPS_DEPLOY=true (secret or variable) to enable it." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Deploy over SSH (pinned host key)
        if: env.DEPLOY_ON == 'true'
        shell: bash
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN: ${{ secrets.VPS_KNOWN_HOSTS }}
          HOST: ${{ secrets.VPS_HOST }}
          USER_: ${{ secrets.VPS_USER }}
          WARN_IN: ${{ github.event_name == 'workflow_dispatch' && inputs.warn_minutes || '10' }}
        run: |
          [[ "$WARN_IN" =~ ^[0-9]+$ ]] && [ "$WARN_IN" -ge 0 ] && [ "$WARN_IN" -le 60 ] \
            || { echo "refusing: warn_minutes must be 0-60, got '$WARN_IN'"; exit 1; }
          echo "## Deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "Deploying version \`${{ needs.check.outputs.version }}\` (commit \`${{ github.sha }}\`) - see the build job summary above for what changed this cycle." >> "$GITHUB_STEP_SUMMARY"
          echo "In-game warning: $WARN_IN minutes (skipped automatically if nobody is online)" >> "$GITHUB_STEP_SUMMARY"
          install -m 600 /dev/null "$RUNNER_TEMP/key"; printf '%s\n' "$KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$KNOWN" > "$RUNNER_TEMP/known_hosts"
          ssh -i "$RUNNER_TEMP/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
              "$USER_@$HOST" "${{ github.sha }} --warn $WARN_IN"
          echo "Deploy command sent; the \`verify\` job checks whether it actually came up healthy." >> "$GITHUB_STEP_SUMMARY"

  # Confirms the deploy actually came up healthy (polls the authenticated /api/health endpoint), then either records this
  # version as the new rollback target or rolls back to the last known-good one and blacklists this commit.
  verify:
    needs: [check, build, deploy]
    if: needs.check.outputs.build == 'true' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: vps-deploy
      cancel-in-progress: false
    env:
      DEPLOY_ON: ${{ secrets.VPS_DEPLOY || vars.VPS_DEPLOY }}
    steps:
      - name: Skipped (no deploy happened)
        if: env.DEPLOY_ON != 'true'
        run: echo "VPS_DEPLOY is off - nothing was deployed, so there is nothing to verify." | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        if: env.DEPLOY_ON == 'true'
      - name: Poll /api/health until healthy or timeout
        id: poll
        if: env.DEPLOY_ON == 'true'
        env:
          STATUS_PASS: ${{ secrets.STATUS_PASSWORD }}
        run: |
          ok=false
          for i in $(seq 1 10); do
            body=$(curl -fsS -u "tom:$STATUS_PASS" "https://ace.mossbuilds.xyz/api/health" || echo "")
            healthy=$(echo "$body" | jq -r '.overall_healthy // false' 2>/dev/null || echo false)
            echo "attempt $i/10: overall_healthy=$healthy"
            if [ "$healthy" = "true" ]; then ok=true; break; fi
            sleep 30
          done
          echo "healthy=$ok" >> "$GITHUB_OUTPUT"
          echo "last_body=$body" >> "$GITHUB_OUTPUT"
      - name: Record this version as last-known-good
        if: env.DEPLOY_ON == 'true' && steps.poll.outputs.healthy == 'true'
        run: |
          {
            echo "## Verify"
            echo "Deploy of \`${{ needs.check.outputs.version }}\` verified healthy - see the build job summary above for what changed this cycle."
          } >> "$GITHUB_STEP_SUMMARY"
          git config user.name "acbuilds-bot"
          git config user.email "acbuilds-bot@users.noreply.github.com"
          echo "${{ needs.check.outputs.version }}" > deploy/LAST_GOOD.txt
          git add deploy/LAST_GOOD.txt
          if ! git diff --cached --quiet; then
            git commit -m "deploy: verified ${{ needs.check.outputs.version }} [skip ci]"
            git push origin HEAD:main
          fi
      - name: Roll back and blacklist on failure/timeout
        if: env.DEPLOY_ON == 'true' && steps.poll.outputs.healthy != 'true'
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN: ${{ secrets.VPS_KNOWN_HOSTS }}
          HOST: ${{ secrets.VPS_HOST }}
          USER_: ${{ secrets.VPS_USER }}
        run: |
          prev=$(grep -vE '^\s*#|^\s*$' deploy/LAST_GOOD.txt | head -n1 || true)
          {
            echo "## Verify - FAILED"
            echo "Deploy of \`${{ needs.check.outputs.version }}\` (commit \`${{ github.sha }}\`) did NOT come up healthy within 5 minutes."
            echo "Last /api/health response: \`${{ steps.poll.outputs.last_body }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$prev" ]; then
            echo "No previous known-good version recorded in deploy/LAST_GOOD.txt - cannot roll back automatically. Manual intervention needed." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Rolling back to last known-good version \`$prev\`." | tee -a "$GITHUB_STEP_SUMMARY"
            install -m 600 /dev/null "$RUNNER_TEMP/key"; printf '%s\n' "$KEY" > "$RUNNER_TEMP/key"
            printf '%s\n' "$KNOWN" > "$RUNNER_TEMP/known_hosts"
            ssh -i "$RUNNER_TEMP/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
                "$USER_@$HOST" "--rollback $prev"
            echo "Rollback to \`$prev\` sent." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          git config user.name "acbuilds-bot"
          git config user.email "acbuilds-bot@users.noreply.github.com"
          echo "${{ github.sha }}" >> deploy/BLACKLIST.txt
          git add deploy/BLACKLIST.txt
          git commit -m "deploy: blacklist ${{ github.sha }} (failed post-deploy verification) [skip ci]"
          git push origin HEAD:main
          echo "Commit ${{ github.sha }} added to deploy/BLACKLIST.txt - it will never be redeployed as-is." | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1
