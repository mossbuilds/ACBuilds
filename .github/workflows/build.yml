name: build-and-publish

# One workflow, auto-magic: polls upstream every 30 min and rebuilds only when something changed.
# (GitHub cannot webhook from repos we don't own, so polling is the trigger for ACEmulator/ACE.)
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if upstream is unchanged"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: build
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/acbuilds
  # Upstream repos watched. ACE core + world data drive the image; the others are recorded in the
  # image label so a change in any of them triggers a rebuild too.
  ACE_REPO: ACEmulator/ACE
  # VR-enabled ACE fork; built as a SECOND, separate server (never replaces the stock one)
  VR_ACE_REPO: Thwargle/ACE
  WORLD_REPO: ACEmulator/ACE-World-16PY-Patches
  WATCHED: >-
    aquafir/ACE.BaseMod shemtar-90/AceForge OptimShi/CustomClothingBase
    titaniumweiner/ACEUniqueWeenies bDekaru/Melt titaniumweiner/OpenDereth

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.cmp.outputs.build }}
      build_stock: ${{ steps.cmp.outputs.build_stock }}
      build_vr: ${{ steps.cmp.outputs.build_vr }}
      ace_sha: ${{ steps.up.outputs.ace_sha }}
      vr_sha: ${{ steps.up.outputs.vr_sha }}
      version: ${{ steps.up.outputs.version }}
      world_tag: ${{ steps.up.outputs.world_tag }}
      fingerprint: ${{ steps.up.outputs.fingerprint }}
      vr_fingerprint: ${{ steps.up.outputs.vr_fingerprint }}
    steps:
      - name: Resolve upstream state
        id: up
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ace=$(gh api repos/$ACE_REPO/commits/master --jq .sha)
          world=$(gh api repos/$WORLD_REPO/releases/latest --jq .tag_name)
          extra=""
          for r in $WATCHED; do
            s=$(gh api repos/$r/commits --jq '.[0].sha' 2>/dev/null || echo none)
            extra="$extra $r@$s"
          done
          # Version = latest ACE release tag + our own revision: v1.78.4816-acb.3
          acev=$(gh api repos/$ACE_REPO/releases/latest --jq .tag_name)
          n=$(gh api "repos/${{ github.repository }}/git/matching-refs/tags/${acev}-acb." --jq 'length' 2>/dev/null || echo 0)
          echo "version=${acev}-acb.$((n+1))" >> "$GITHUB_OUTPUT"
          vr=$(gh api repos/$VR_ACE_REPO/commits/master --jq .sha)
          echo "vr_sha=$vr" >> "$GITHUB_OUTPUT"
          echo "ace_sha=$ace" >> "$GITHUB_OUTPUT"
          echo "world_tag=$world" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$(echo "$ace $world $extra" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "vr_fingerprint=$(echo "$vr $world $extra" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Compare with published images
        id: cmp
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          label() { docker buildx imagetools inspect "$1" --format '{{json .Image.Config.Labels}}' 2>/dev/null | jq -r --arg k "$2" '.[$k] // ""' || true; }
          old=$(label "$IMAGE-server:latest" acbuilds.fingerprint)
          oldvr=$(label "$IMAGE-vr-server:latest" acbuilds.vr.fingerprint)
          new="${{ steps.up.outputs.fingerprint }}"
          newvr="${{ steps.up.outputs.vr_fingerprint }}"
          echo "stock: published=$old upstream=$new | vr: published=$oldvr upstream=$newvr"
          force=false
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.force }}" = "true" ]; then force=true; fi
          bs=false; bv=false
          if [ "$force" = true ] || [ "$old" != "$new" ]; then bs=true; fi
          if [ "$force" = true ] || [ "$oldvr" != "$newvr" ]; then bv=true; fi
          echo "build_stock=$bs" >> "$GITHUB_OUTPUT"
          echo "build_vr=$bv" >> "$GITHUB_OUTPUT"
          if [ "$bs" = true ] || [ "$bv" = true ]; then echo "build=true" >> "$GITHUB_OUTPUT"; else echo "build=false" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push server image
        if: needs.check.outputs.build_stock == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server
          push: true
          build-args: |
            ACE_REF=${{ needs.check.outputs.ace_sha }}
            MODS_REV=${{ needs.check.outputs.fingerprint }}
          labels: |
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
            acbuilds.fingerprint=${{ needs.check.outputs.fingerprint }}
          tags: |
            ${{ env.IMAGE }}-server:latest
            ${{ env.IMAGE }}-server:${{ needs.check.outputs.version }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
      - name: Build and push database image
        if: needs.check.outputs.build_stock == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.db
          push: true
          build-args: |
            ACE_REF=${{ needs.check.outputs.ace_sha }}
            MODS_REV=${{ needs.check.outputs.fingerprint }}
            WORLD_TAG=${{ needs.check.outputs.world_tag }}
          labels: |
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
          tags: |
            ${{ env.IMAGE }}-db:latest
            ${{ env.IMAGE }}-db:${{ needs.check.outputs.version }}
          cache-from: type=gha,scope=db
          cache-to: type=gha,mode=max,scope=db
      - name: Build and push VR server image
        if: needs.check.outputs.build_vr == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server
          push: true
          build-args: |
            ACE_REPO=https://github.com/${{ env.VR_ACE_REPO }}.git
            ACE_REF=${{ needs.check.outputs.vr_sha }}
            MODS_REV=${{ needs.check.outputs.fingerprint }}
          labels: |
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
            acbuilds.vr.ace=${{ needs.check.outputs.vr_sha }}
            acbuilds.vr.fingerprint=${{ needs.check.outputs.vr_fingerprint }}
          tags: |
            ${{ env.IMAGE }}-vr-server:latest
            ${{ env.IMAGE }}-vr-server:${{ needs.check.outputs.version }}
          cache-from: type=gha,scope=vr-server
          cache-to: type=gha,mode=max,scope=vr-server
      - name: Build and push VR database image
        if: needs.check.outputs.build_vr == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.db
          push: true
          build-args: |
            ACE_REPO=https://github.com/${{ env.VR_ACE_REPO }}.git
            ACE_REF=${{ needs.check.outputs.vr_sha }}
            WORLD_TAG=${{ needs.check.outputs.world_tag }}
            MODS_REV=${{ needs.check.outputs.fingerprint }}
          labels: |
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
          tags: |
            ${{ env.IMAGE }}-vr-db:latest
            ${{ env.IMAGE }}-vr-db:${{ needs.check.outputs.version }}
          cache-from: type=gha,scope=vr-db
          cache-to: type=gha,mode=max,scope=vr-db
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILT_STOCK: ${{ needs.check.outputs.build_stock }}
          BUILT_VR: ${{ needs.check.outputs.build_vr }}
        run: |
          v="${{ needs.check.outputs.version }}"
          notes=""
          if [ "$BUILT_STOCK" = true ]; then
            notes="$notes
          Server: \`docker pull ${{ env.IMAGE }}-server:$v\`
          Database: \`docker pull ${{ env.IMAGE }}-db:$v\`
          - ACE: https://github.com/ACEmulator/ACE/commit/${{ needs.check.outputs.ace_sha }}"
          fi
          if [ "$BUILT_VR" = true ]; then
            notes="$notes
          VR server (separate, from Thwargle/ACE): \`docker pull ${{ env.IMAGE }}-vr-server:$v\` and \`docker pull ${{ env.IMAGE }}-vr-db:$v\`
          - VR ACE fork: https://github.com/Thwargle/ACE/commit/${{ needs.check.outputs.vr_sha }}"
          fi
          notes="$notes
          Packages: https://github.com/${{ github.repository }}/pkgs/container/acbuilds-server , https://github.com/${{ github.repository }}/pkgs/container/acbuilds-vr-server
          - World data: ${{ needs.check.outputs.world_tag }}"
          gh release create "$v" --target "$(git rev-parse HEAD)" --title "ACBuilds $v" --notes "$notes"

  # Self-contained launcher executables (Python + PyInstaller), one per OS, attached to the same versioned release.
  launcher:
    needs: [check, build]
    if: needs.check.outputs.build == 'true'
    strategy:
      matrix:
        include:
          - { os: windows-latest, asset: acbuilds-windows-x64.exe, dist: acbuilds.exe }
          - { os: ubuntu-latest,  asset: acbuilds-linux-x64,       dist: acbuilds }
          - { os: macos-latest,   asset: acbuilds-macos-arm64,     dist: acbuilds }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build executable
        shell: bash
        run: |
          pip install pyinstaller
          echo 'VERSION = "${{ needs.check.outputs.version }}"' > launcher/_version.py
          cd launcher && pyinstaller --onefile --name acbuilds --paths . --hidden-import gui acblauncher.py
          cp dist/${{ matrix.dist }} ../${{ matrix.asset }}
      - name: Attach to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.check.outputs.version }}" "${{ matrix.asset }}" --clobber

  # Auto-deploy to the VPS after a successful publish. Off until VPS_DEPLOY (secret or variable) is 'true'.
  # The deploy key can only run /opt/acbuilds/deploy.sh (SSH forced command); that script backs up the database FIRST.
  deploy:
    needs: [check, build]
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: vps-deploy
      cancel-in-progress: false
    # VPS_DEPLOY can be a repository secret OR a repository variable (secrets cannot be read in a job-level 'if', so it is
    # copied into the environment here and checked per step).
    env:
      DEPLOY_ON: ${{ secrets.VPS_DEPLOY || vars.VPS_DEPLOY }}
    steps:
      - name: Skipped (VPS_DEPLOY is not 'true')
        if: env.DEPLOY_ON != 'true'
        run: echo "VPS auto-deploy is off. Set VPS_DEPLOY=true (secret or variable) to enable it."
      - name: Deploy over SSH (pinned host key)
        if: env.DEPLOY_ON == 'true'
        shell: bash
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN: ${{ secrets.VPS_KNOWN_HOSTS }}
          HOST: ${{ secrets.VPS_HOST }}
          USER_: ${{ secrets.VPS_USER }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/key"; printf '%s\n' "$KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$KNOWN" > "$RUNNER_TEMP/known_hosts"
          ssh -i "$RUNNER_TEMP/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
              "$USER_@$HOST" "${{ github.sha }}"
