name: udp-probe
# TEMPORARY diagnostic: send UDP packets from a GitHub runner to the VPS game ports so we can see whether they arrive. Removed after use.
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import socket, time
          s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          for i in range(45):
              for p in (9000, 9100, 12345):
                  s.sendto(b"udp-probe-from-github", ("89.117.147.78", p))
              time.sleep(1)
          print("sent probes for 45s")
          PY
